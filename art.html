<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Pictures</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            background: #fff;
        }

        /* 7 columns, rows are added automatically */
        .gallery {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            /* the little gap between pictures */
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 3 / 4;
            /* tall cells */
            object-fit: cover;
            /* fills each cell without stretching */
            display: block;
        }

        /* Fewer columns on smaller screens */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="gallery">
        <img src="Art/portrait_1.jpeg" alt="ID_shot_of_a_man">
        <img src="Art/portrait_2.jpeg" alt="a_guy_standing_by_a_gate">
        <img src="Art/portrait_3.jpeg" alt="ID_shot_of_a_man">
        <img src="Art/picture_of_a_man.jpeg" alt="ID_shot_of_a_man">
        <img src="Art/picture_of_a_man1.jpeg" alt="ID_shot_of_a_man">
        <img src="Art/portrait_of_a_girl.jpeg" alt="portrait_of_a_girl">
        <img src="Art/saitama.jpeg" alt="anime_character">
        <img src="Art/Sasuke.png" alt="anime_character">
        <img src="Art/Window_View_Blue.PNG" alt="outside_view">
        <img src="Art/Window_View_Green.PNG" alt="outside_view">
        <img src="Art/rockLee.png" alt="rockLee_naruto">
        <img src="Art/IMG_1822.PNG" alt="isolated_tree">
        <img src="Art/IMG_1825.PNG" alt="two_trees_with_sky_and_moon">
        <img src="Art/kiba_and_akamaru.jpeg" alt="kiba_and_akamaru_naruto">
    </div>

</body>

</html>
